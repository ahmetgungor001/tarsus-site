<!doctype html>
<html lang="tr-TR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sayfa bulunamadı (404) | Güngör Digital</title>
<meta name="description" content="Aradığınız sayfayı bulamadık. Güngör Digital Tarsus ve Mersin web tasarım, yazılım ve dijital hizmetler sayfalarına dönün.">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#F8F9FF">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
.not-found-page{min-height:100vh;display:flex;flex-direction:column}
.not-found-header .nav{height:76px}
.not-found-main{flex:1;display:grid;place-items:center;padding:56px 20px 72px;overflow:hidden;position:relative;isolation:isolate}
.not-found-main:before,.not-found-main:after{content:"";position:absolute;z-index:-1;pointer-events:none}
.not-found-main:before{width:min(70vw,760px);aspect-ratio:1;border:1px solid rgba(29,78,216,.08);border-radius:50%;left:-22%;top:-32%}
.not-found-main:after{width:min(52vw,540px);aspect-ratio:1;border:1px solid rgba(29,78,216,.08);border-radius:50%;right:-17%;bottom:-28%}
.not-found-card{width:min(100%,900px);display:grid;grid-template-columns:1fr .82fr;align-items:center;gap:48px;padding:clamp(28px,6vw,68px);background:rgba(255,255,255,.88);border:1px solid var(--line2);border-radius:16px;box-shadow:0 24px 80px rgba(10,13,20,.08);backdrop-filter:blur(10px)}
.not-found-copy{max-width:500px}
.not-found-kicker{display:inline-flex;align-items:center;gap:10px;color:var(--primary);font-size:.9rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:18px}
.not-found-kicker:before{content:"";width:8px;height:8px;background:var(--primary);border-radius:50%;box-shadow:0 0 0 5px rgba(29,78,216,.1)}
.not-found-code{font-family:"Plus Jakarta Sans",Inter,sans-serif;font-size:clamp(5rem,13vw,9.5rem);line-height:.85;letter-spacing:-.09em;font-weight:800;color:var(--primary);margin:0 0 24px}
.not-found-copy h1{font-size:clamp(1.8rem,4vw,2.7rem);margin-bottom:14px}
.not-found-copy p{font-size:1.05rem;color:var(--muted);max-width:460px;margin:0}
.not-found-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.not-found-visual{min-height:270px;display:grid;place-items:center;position:relative}
.not-found-orbit{width:min(100%,290px);aspect-ratio:1;border:1px solid var(--line2);border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle,rgba(220,233,255,.8),rgba(248,249,255,.18) 68%)}
.not-found-orbit:before,.not-found-orbit:after{content:"";position:absolute;border:1px dashed rgba(29,78,216,.22);border-radius:50%;inset:18px;transform:rotate(-28deg) scaleX(.72)}
.not-found-orbit:after{inset:38px;transform:rotate(34deg) scaleX(.72)}
.not-found-mark{width:112px;height:112px;border-radius:24px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-hover);display:grid;place-items:center;color:var(--primary);position:relative}
.not-found-mark svg{width:62px;height:62px}
.not-found-node{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--primary);border:3px solid #fff;box-shadow:0 0 0 1px rgba(29,78,216,.2)}
.not-found-node.one{top:27px;left:42px}.not-found-node.two{right:17px;top:105px;background:#22C55E}.not-found-node.three{bottom:32px;left:73px;background:#F59E0B}
.not-found-footer{border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:.86rem}
.not-found-footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media(max-width:720px){.not-found-main{padding:30px 16px 42px}.not-found-card{grid-template-columns:1fr;gap:20px;padding:32px 24px}.not-found-visual{grid-row:1;min-height:190px}.not-found-orbit{width:190px}.not-found-mark{width:78px;height:78px;border-radius:18px}.not-found-mark svg{width:46px;height:46px}.not-found-node.one{top:18px;left:27px}.not-found-node.two{right:8px;top:68px}.not-found-node.three{bottom:20px;left:48px}.not-found-code{font-size:5.3rem;margin-bottom:18px}.not-found-copy h1{font-size:1.8rem}.not-found-actions{margin-top:24px}}
@media(max-width:430px){.not-found-actions{display:grid}.not-found-actions .btn{width:100%}.not-found-footer .wrap{justify-content:center;text-align:center}}
</style>
</head>
<body class="not-found-page">
<a class="skip" href="#main">İçeriğe geç</a>
<header class="site-header not-found-header">
  <div class="wrap nav">
    <a class="logo" href="/" aria-label="Güngör Digital ana sayfa">
      <img src="/assets/logo.png" alt="" width="38" height="38">
      <span class="logo-t"><b>Güngör Digital</b><small>TARSUS / MERSİN</small></span>
    </a>
    <a class="btn btn-outline btn-sm" href="/iletisim.html">İletişim</a>
  </div>
</header>
<main class="not-found-main" id="main">
  <section class="not-found-card" aria-labelledby="not-found-title">
    <div class="not-found-copy">
      <span class="not-found-kicker">Adres bulunamadı</span>
      <p class="not-found-code" aria-label="Hata kodu 404">404</p>
      <h1 id="not-found-title">Bu sayfa burada değil.</h1>
      <p>Adres değişmiş ya da yanlış yazılmış olabilir. Aradığınız hizmete ana sayfadan ulaşabilir veya bize doğrudan yazabilirsiniz.</p>
      <div class="not-found-actions">
        <a class="btn btn-primary" href="/">Ana sayfaya dön</a>
        <a class="btn btn-outline" href="/tarsus-web-tasarim.html">Tarsus web tasarım</a>
      </div>
    </div>
    <div class="not-found-visual" aria-hidden="true">
      <div class="not-found-orbit">
        <span class="not-found-node one"></span><span class="not-found-node two"></span><span class="not-found-node three"></span>
        <div class="not-found-mark">
          <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 13h20a7 7 0 0 1 7 7v24a7 7 0 0 1-7 7H22a7 7 0 0 1-7-7V20a7 7 0 0 1 7-7Z"/>
            <path d="M25 25v.1M39 25v.1M25 39c4 4 10 4 14 0"/>
            <path d="m46 12 6 6m0-6-6 6"/>
          </svg>
        </div>
      </div>
    </div>
  </section>
</main>
<footer class="not-found-footer"><div class="wrap"><span>© 2026 Güngör Digital</span><span>Tarsus · Mersin</span></div></footer>
</body>
</html>
